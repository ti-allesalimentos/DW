version: 2

sources:
  - name: bronze
    description: >
      Espelho fiel das tabelas do Protheus, carregado pelo extrator.
      Sem TRIM, sem filtro, sem regra. Campos texto vem com o padding
      CHAR de largura fixa do Protheus.
    schema: bronze
    loaded_at_field: _carregado_em
    freshness:
      # A carga e intradiaria: mais de 6h sem dado novo e sinal de falha.
      warn_after: {count: 6, period: hour}
      error_after: {count: 24, period: hour}
    tables:
      - name: sd2010
        description: Itens de nota fiscal de saida (faturamento).
        columns:
          - name: r_e_c_n_o_
            description: Chave unica da tabela no Protheus. Chave do MERGE.
            tests: [unique, not_null]
      - name: sf2010
        description: Cabecalho da nota fiscal de saida.
        columns:
          - name: r_e_c_n_o_
            tests: [unique, not_null]
      - name: sd1010
        description: Itens de nota fiscal de entrada (devolucoes, compras, acordo).
        columns:
          - name: r_e_c_n_o_
            tests: [unique, not_null]
      - name: sf1010
        description: Cabecalho da nota fiscal de entrada.
        columns:
          - name: r_e_c_n_o_
            tests: [unique, not_null]
      - name: sc5010
        description: Pedidos de venda (cabecalho).
        columns:
          - name: r_e_c_n_o_
            tests: [unique, not_null]
      - name: sc6010
        description: Itens do pedido de venda.
      - name: sa1010
        description: Cadastro de clientes.
      - name: sa2010
        description: Cadastro de fornecedores.
      - name: sa3010
        description: Cadastro de vendedores e gerentes.
      - name: sb1010
        description: Cadastro de produtos.
      - name: se4010
        description: Condicoes de pagamento.
      - name: sc9010
        description: Liberacao/embarque de pedido de venda.
      - name: sf4010
        description: Tipos de operacao (TES).
      - name: dak010
        description: Datas de embarque/carga.
      - name: se1010
        description: Titulos a receber (contas a receber).
        columns:
          - name: r_e_c_n_o_
            tests: [unique, not_null]
      - name: se2010
        description: Titulos a pagar (contas a pagar).
        columns:
          - name: r_e_c_n_o_
            tests: [unique, not_null]
      - name: se5010
        description: Movimento bancario — baixas de titulos, base da comissao.
        columns:
          - name: r_e_c_n_o_
            tests: [unique, not_null]
      - name: sed010
        description: Naturezas financeiras (descricao).
      - name: cq0010
        description: Saldo/movimento de contas correntes.
      - name: ct1010
        description: Plano de contas.
      - name: sa6010
        description: Bancos e contas correntes cadastradas.
      - name: f7g010
        description: Motivos de baixa de titulo.
      - name: frv010
        description: Carteira/situacao de cobranca.
      - name: sig010
        description: Conciliador bancario.
      - name: ctt010
        description: Centros de custo.
      - name: sx5010
        description: Tabelas genericas do Protheus (parametrizacao).
      - name: sbm010
        description: Grupos de produto.
      - name: fk5010
        description: Movimento bancario importado (OFX).
      - name: fk7010
        description: Movimento bancario importado (OFX).
      - name: sev010
        description: Rateio de titulo por multiplas naturezas financeiras.
      - name: sft010
        description: Tributo por NF (ICMS/IPI/PIS/COFINS/IRRF/INSS), calculado pelo Protheus.
        columns:
          - name: r_e_c_n_o_
            tests: [unique, not_null]
      - name: sdt010
        description: Tributo extraido do XML da NFe, pra conferencia contra o SFT010.
      - name: ac9010
        description: "Anexo/documento digitalizado vinculado a um registro (ex. NF de entrada)."
      - name: f2b010
        description: Cadastro de tributo (ICMS, PIS, COFINS, IPI...).
      - name: f2d010
        description: Apuracao de tributo por item de NF (base, aliquota, valor).
      - name: sh6010
        description: Apontamento de producao (ordem de producao x operacao executada).
        columns:
          - name: r_e_c_n_o_
            tests: [unique, not_null]
      - name: sd3010
        description: Lancamento de estoque (consumo de insumo, producao, reprocesso).
        columns:
          - name: r_e_c_n_o_
            tests: [unique, not_null]
      - name: sc2010
        description: Ordem de producao (cabecalho, quantidades e datas planejadas/realizadas).
        columns:
          - name: r_e_c_n_o_
            tests: [unique, not_null]
      - name: sg2010
        description: "Cadastro de operacao (roteiro de producao)."
      - name: sb9010
        description: Saldo de estoque (posicao por produto/local/data).
        columns:
          - name: r_e_c_n_o_
            tests: [unique, not_null]
      - name: sc7010
        description: Pedido de compra.
        columns:
          - name: r_e_c_n_o_
            tests: [unique, not_null]
      - name: sc1010
        description: Solicitacao de compra.
        columns:
          - name: r_e_c_n_o_
            tests: [unique, not_null]
      - name: sb2010
        description: Saldo de estoque por local (grao mais fino que SB9010).
        columns:
          - name: r_e_c_n_o_
            tests: [unique, not_null]
      - name: sys_usr
        description: Usuarios do Protheus (comprador/solicitante).
