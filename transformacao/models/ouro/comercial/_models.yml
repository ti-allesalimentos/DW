  - name: sk_vendedor
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_vendedor')
          field: sk_vendedor
- name: fato_devolucoes
  description: 'Fato devolucoes — Protheus (SD1010). Grao: item de nota fiscal de entrada por devolucao
