version: 2
models:
- name: agg_faturamento_mes
  description: 'Agregado mensal de Venda Real (liquida de devolucao) — grao ano_mes x filial x sk_cliente
    x sk_vendedor x sk_supervisor x sk_gerente x sk_produto x familia. Serve o portal do Oryon Board (area
    Faturamento & Comercial) sem recalcular o netting linha a linha a cada request; Rede/Regiao/Cidade/Estado
    resolvem via join com dim_cliente em tempo de consulta (nao entram no grao pra nao inflar a cardinalidade).

    '
  columns:
  - name: ano_mes
    tests:
    - not_null
- name: agg_faturamento_cliente_mes
  description: 'Agregado mensal de Venda Real por cliente — grao ano_mes x filial x sk_cliente x familia.
    Serve a Analise Detalhada (ranking por cliente), Positivacao e Carteira e Curva ABC e Mix do portal.

    '
  columns:
  - name: ano_mes
    tests:
    - not_null
- name: agg_faturamento_produto_mes
  description: 'Agregado mensal de Venda Real por produto — grao ano_mes x filial x sk_produto. Serve
    a abertura por produto da Analise Detalhada do portal.

    '
  columns:
  - name: ano_mes
    tests:
    - not_null
- name: fato_faturamento
  description: 'Fato faturamento — Protheus (SD2010). Grao: item de nota fiscal de saida. Chaves substitutas
    resolvidas contra dim_cliente/dim_produto/ dim_vendedor; sem match cai no membro "NAO_IDENTIFICADO"
    de cada dimensao (nunca fica orfao silencioso).

    '
  columns:
  - name: recno_origem
    tests:
    - unique
    - not_null
  - name: sk_cliente
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_cliente')
          field: sk_cliente
  - name: sk_produto
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_produto')
          field: sk_produto
  - name: sk_vendedor
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_vendedor')
          field: sk_vendedor
  - name: total
    tests:
    - not_null
- name: fato_bonificacao
  description: 'Fato bonificacao — Protheus (SD2010, CFOP de bonificacao/amostra gratis). Grao: item de
    nota fiscal.

    '
  columns:
