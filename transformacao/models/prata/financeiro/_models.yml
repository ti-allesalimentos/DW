version: 2
models:
- name: stg_contas_areceber
  description: 'Titulos a receber (SE1010), conformados. Grao recno_origem, sem filtro de negocio (universo
    inteiro, aberto ou baixado).

    '
  columns:
  - name: recno_origem
    tests:
    - unique
    - not_null
  - name: filial
    tests:
    - not_null
  - name: chave_cliente
    tests:
    - not_null
- name: stg_contas_apagar
  description: 'Titulos a pagar (SE2010), conformados. Grao recno_origem. Exclui tipos FT/NDF/PA/PRE —
    ver nota no modelo.

    '
  columns:
  - name: recno_origem
    tests:
    - unique
    - not_null
  - name: filial
    tests:
    - not_null
  - name: chave_fornecedor
    tests:
    - not_null
- name: stg_saldo_conta_corrente
  description: 'Saldo diario de conta corrente (CQ0010), grao filial+conta+data. Replica sqlConsulta via
    window function em vez do self-join original — ver nota no modelo sobre o bug de VALOR_REALIZADO.

    '
  columns:
  - name: filial
    tests:
    - not_null
  - name: codigo_conta
    tests:
    - not_null
  - name: data
    tests:
    - not_null
- name: stg_movimento_bancario_juros
  description: 'Movimento bancario de juros/antecipacao (SE5010, motivo ''DEB''). Grao recno_origem.

    '
  columns:
  - name: recno_origem
    tests:
    - unique
    - not_null
- name: stg_movimento_bancario_ncc
  description: 'Movimento bancario de NCC (SE5010, tipo ''NCC''). Grao recno_origem.

    '
  columns:
  - name: recno_origem
    tests:
    - unique
    - not_null
- name: stg_tarifas_bancarias
  description: 'Tarifas bancarias (SE5010, naturezas de tarifa/IOF). Grao recno_origem.

    '
  columns:
  - name: recno_origem
    tests:
    - unique
    - not_null
- name: stg_descontos_obtidos
  description: 'Descontos obtidos de fornecedores (SE2010, E2_DESCONT <> 0). Grao recno_origem.

    '
  columns:
  - name: recno_origem
    tests:
    - unique
    - not_null
  - name: chave_fornecedor
    tests:
    - not_null
- name: stg_descontos_concedidos
  description: 'Descontos concedidos a clientes (SE1010, E1_DESCONT <> 0). Grao recno_origem.

    '
  columns:
  - name: recno_origem
    tests:
    - unique
    - not_null
  - name: chave_cliente
    tests:
    - not_null
- name: stg_rateio_natureza
  description: 'Rateio de titulo por multiplas naturezas financeiras (SEV010). Grao recno_origem.

    '
  columns:
  - name: recno_origem
    tests:
    - unique
    - not_null
- name: stg_lancamento_indireto
  description: 'Lancamento de estoque indireto, sem OP (SD3010, TM=505). Grao recno_origem.

    '
  columns:
  - name: recno_origem
    tests:
    - unique
    - not_null
- name: stg_custo_comissao_compra
  description: 'Custo de comissao sobre compra (SF1010 tipo ''C'', serie ''COM'') — nao confundir com
    a comissao de vendas da Fase 4. Grao filial+nf+serie+fornecedor+produto+nf_origem.

    '
  columns:
  - name: filial
    tests:
    - not_null
