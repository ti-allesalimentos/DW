version: 2

models:
  - name: stg_faturamento
    description: >
      Itens de nota fiscal de saida conformados, com as regras de negocio
      explicitas aplicadas (CFOP, filial, exclusoes) e a conversao
      caixa->quilo resolvida uma unica vez.
    columns:
      - name: recno_origem
        description: R_E_C_N_O_ da SD2010. Rastreia a linha ate a origem.
        tests: [unique, not_null]
      - name: filial
        tests: [not_null]
      - name: nfe
        tests: [not_null]
      - name: dt_emissao
        description: Data de emissao. Nunca anterior a entrada do Protheus.
        tests: [not_null]
      - name: cod_produto
        description: Codigo base, ja sem o sufixo -CX.
        tests: [not_null]
      - name: chave_cliente
        tests: [not_null]
      - name: total
        tests: [not_null]
      - name: um
        tests:
          - accepted_values:
              arguments:
                values: ['KG', 'UN', 'CX', 'PC', 'FD', 'LT']
              config:
                severity: warn
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "dt_emissao >= '2025-02-01'"
          config:
            severity: warn
            error_if: ">1000"

  - name: stg_bonificacao
    description: >
      Itens de nota fiscal de saida classificados como bonificacao/amostra
      gratis (CFOP 5910/5911/6910/6911), conformados. Mesma origem e
      mesmos joins do stg_faturamento.
    columns:
      - name: filial
        tests: [not_null]
      - name: nfe
        tests: [not_null]
      - name: cod_produto
        tests: [not_null]
      - name: dt_emissao
        tests: [not_null]

  - name: stg_devolucoes
    description: >
      Itens de nota fiscal de entrada por devolucao de venda (SD1010),
      conformados. Motivo e destino resolvidos contra os seeds
      motivo_dev e destino (sigla sem match fica visivel como NULL).
    columns:
      - name: filial
        tests: [not_null]
      - name: nf
        tests: [not_null]
      - name: cod_produto
        tests: [not_null]
      - name: dt_emissao
        tests: [not_null]

  - name: stg_refaturamento
    description: >
      Refaturamento (reemissao de NF), agregado por filial/produto/NF/
      serie/data. So notas com pedido marcado como refaturamento
      (SC5010.C5_X_REFAT preenchido).
    columns:
      - name: filial
        tests: [not_null]
      - name: cod_produto
        tests: [not_null]
      - name: nfe
        tests: [not_null]

  - name: stg_remessa_industrializacao
    description: >
      Remessa para industrializacao (CFOP 5901/5903/6901/6903),
      conformada. Vendedor vem do cabecalho da nota (SF2.F2_VEND1), nao
      do cadastro do cliente. Ver nota no topo do modelo sobre a
      duplicacao com "remessa triangular" no legado.
    columns:
      - name: filial
        tests: [not_null]
      - name: nfe
        tests: [not_null]
      - name: cod_produto
        tests: [not_null]

  - name: stg_coopeval_remessa
    description: >
      Remessas do cliente Coopeval (07390806). Sem filtro de CFOP no
      legado, so o cliente.
    columns:
      - name: filial
        tests: [not_null]
      - name: nfe
        tests: [not_null]
      - name: cod_produto
        tests: [not_null]

  - name: stg_acordo_comercial
    description: >
      Acordo comercial (entrada de verba/bonificacao do fornecedor via
      TES 050/052), conformado. Sem join com outras tabelas -- a query
      legada usa so o SD1010.
    columns:
      - name: filial
        tests: [not_null]
      - name: cod_produto
        tests: [not_null]
      - name: dt_emissao
        tests: [not_null]

  - name: stg_pedidos
    description: >
      Pedidos de venda liberados/embarcados (SC9010), agregado por
      pedido/cliente/produto/item/sequencia. Sem equivalente
      reconciliavel no piloto anterior (fonte nova, nao migrada antes).
    columns:
      - name: filial
        tests: [not_null]
      - name: pedido
        tests: [not_null]
      - name: cod_produto
        tests: [not_null]
      - name: chave_cliente
        tests: [not_null]

  - name: stg_faturamento_datavale
    description: >
      Historico de faturamento do DATAVALE (ERP anterior ao Protheus,
      02/2024 a 01/2025), com cliente e vendedor resolvidos contra o
      cadastro atual. Ainda nao unificado com stg_faturamento — grao e
      colunas diferem (sem CFOP, sem serie/item de NF, sem impostos).
    columns:
      - name: filial
        tests: [not_null]
      - name: cod_produto
        tests: [not_null]
      - name: dt_emissao
        tests: [not_null]
      - name: chave_cliente
        tests: [not_null]
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            # Taxa de casamento por CNPJ medida em 28/08/2026: 99,3%
            # (cerca de 216 das 30.827 linhas sem match). Um teste de
            # not_null puro quebraria a cada carga; o limite absoluto
            # abaixo da margem de ~1000 linhas antes de investigar
            # regressao no de-para.
            expression: "chave_cliente <> 'NAO_IDENTIFICADO'"
          config:
            severity: warn
            error_if: ">1000"

  - name: stg_comissao
    description: >
      Comissao sobre baixa de titulo (SE5010), agregada por evento de
      baixa. Fase 4 — carryover da Fase 2, que adiou comissao por
      depender de tabelas do Financeiro (SE1010/SE5010).
    columns:
      - name: filial
        tests: [not_null]
      - name: titulo
        tests: [not_null]
      - name: chave_cliente
        tests: [not_null]
      - name: valor
        tests: [not_null]

  - name: stg_contas_areceber
    description: >
      Titulos a receber (SE1010), conformados. Grao recno_origem, sem
      filtro de negocio (universo inteiro, aberto ou baixado).
    columns:
      - name: recno_origem
        tests: [unique, not_null]
      - name: filial
        tests: [not_null]
      - name: chave_cliente
        tests: [not_null]

  - name: stg_contas_apagar
    description: >
      Titulos a pagar (SE2010), conformados. Grao recno_origem. Exclui
      tipos FT/NDF/PA/PRE — ver nota no modelo.
    columns:
      - name: recno_origem
        tests: [unique, not_null]
      - name: filial
        tests: [not_null]
      - name: chave_fornecedor
        tests: [not_null]

  - name: stg_saldo_conta_corrente
    description: >
      Saldo diario de conta corrente (CQ0010), grao filial+conta+data.
      Replica sqlConsulta via window function em vez do self-join
      original — ver nota no modelo sobre o bug de VALOR_REALIZADO.
    columns:
      - name: filial
        tests: [not_null]
      - name: codigo_conta
        tests: [not_null]
      - name: data
        tests: [not_null]

  - name: stg_movimento_bancario_juros
    description: >
      Movimento bancario de juros/antecipacao (SE5010, motivo 'DEB').
      Grao recno_origem.
    columns:
      - name: recno_origem
        tests: [unique, not_null]

  - name: stg_movimento_bancario_ncc
    description: >
      Movimento bancario de NCC (SE5010, tipo 'NCC'). Grao recno_origem.
    columns:
      - name: recno_origem
        tests: [unique, not_null]

  - name: stg_tarifas_bancarias
    description: >
      Tarifas bancarias (SE5010, naturezas de tarifa/IOF). Grao
      recno_origem.
    columns:
      - name: recno_origem
        tests: [unique, not_null]

  - name: stg_descontos_obtidos
    description: >
      Descontos obtidos de fornecedores (SE2010, E2_DESCONT <> 0).
      Grao recno_origem.
    columns:
      - name: recno_origem
        tests: [unique, not_null]
      - name: chave_fornecedor
        tests: [not_null]

  - name: stg_descontos_concedidos
    description: >
      Descontos concedidos a clientes (SE1010, E1_DESCONT <> 0).
      Grao recno_origem.
    columns:
      - name: recno_origem
        tests: [unique, not_null]
      - name: chave_cliente
        tests: [not_null]

  - name: stg_rateio_natureza
    description: >
      Rateio de titulo por multiplas naturezas financeiras (SEV010).
      Grao recno_origem.
    columns:
      - name: recno_origem
        tests: [unique, not_null]

  - name: stg_tributo_nf
    description: >
      Tributo por NF calculado pelo Protheus (SFT010), formato largo
      (ICMS/IPI/PIS/COFINS/IRRF/INSS/ISS numa linha so). Grao
      recno_origem.
    columns:
      - name: recno_origem
        tests: [unique, not_null]
      - name: filial
        tests: [not_null]

  - name: stg_impostos_entrada
    description: >
      Tributo por item de NF de entrada, formato normalizado (item x
      tipo de tributo), via F2B010/F2D010. Grao sk_linha.
    columns:
      - name: sk_linha
        tests: [unique, not_null]

  - name: stg_impostos_saida
    description: >
      Tributo por item de NF de saida, formato normalizado — espelha
      stg_impostos_entrada trocando SD1010 por SD2010. Grao sk_linha.
    columns:
      - name: sk_linha
        tests: [unique, not_null]

  - name: stg_notas_servico
    description: >
      Notas fiscais de servico (SF1010, especie 'NFS') com as
      retencoes (IR/INSS/PIS/COFINS/CSLL/ISS). Grao recno_origem.
    columns:
      - name: recno_origem
        tests: [unique, not_null]

  - name: stg_notas_anexo
    description: >
      NF de entrada (exceto SPED/CTE) x anexo digitalizado vinculado
      (AC9010). Grao recno_origem.
    columns:
      - name: recno_origem
        tests: [unique, not_null]

  - name: stg_apontamento_producao
    description: >
      Apontamento de producao (SH6010) — operacao executada numa OP,
      com horario e quantidade produzida. Grao recno_origem.
    columns:
      - name: recno_origem
        tests: [unique, not_null]

  - name: stg_ordem_producao
    description: >
      Ordem de producao (SC2010), cabecalho com quantidades e datas
      planejadas/realizadas. Grao recno_origem.
    columns:
      - name: recno_origem
        tests: [unique, not_null]
      - name: op
        tests: [not_null]

  - name: stg_lancamento_producao
    description: >
      Lancamento de estoque ligado a OP — consumo de massa/insumo
      (SD3010, TM>500). Grao recno_origem. Sem o filtro de filial
      01004 do legado — ver nota no modelo.
    columns:
      - name: recno_origem
        tests: [unique, not_null]

  - name: stg_lancamento_indireto
    description: >
      Lancamento de estoque indireto, sem OP (SD3010, TM=505). Grao
      recno_origem.
    columns:
      - name: recno_origem
        tests: [unique, not_null]

  - name: stg_reprocesso
    description: >
      Reprocesso de producao (SD3010, TM=200), com o produto-pai da OP
      original. Grao recno_origem.
    columns:
      - name: recno_origem
        tests: [unique, not_null]

  - name: stg_produto_acabado
    description: >
      Producao de produto acabado por OP (SD3010, TM=10), agregada.
      Grao filial+op+cod_produto.
    columns:
      - name: filial
        tests: [not_null]
      - name: op
        tests: [not_null]

  - name: stg_consumo_producao
    description: >
      Consumo de materia-prima/insumo por OP (SD3010, CFOP contendo
      'RE'), agregado. Grao filial+op+cod_produto+data.
    columns:
      - name: filial
        tests: [not_null]
      - name: op
        tests: [not_null]

  - name: stg_perdas_producao
    description: >
      Perdas de producao por OP (SD3010, TM=507), agregada. Grao
      filial+op+cod_produto+data.
    columns:
      - name: filial
        tests: [not_null]
      - name: op
        tests: [not_null]

  - name: stg_entradas_custo
    description: >
      Itens de NF de entrada pra custeio (SF1010+SD1010, tipo N/C).
      Grao recno_origem.
    columns:
      - name: recno_origem
        tests: [unique, not_null]

  - name: stg_custo_comissao_compra
    description: >
      Custo de comissao sobre compra (SF1010 tipo 'C', serie 'COM') —
      nao confundir com a comissao de vendas da Fase 4. Grao
      filial+nf+serie+fornecedor+produto+nf_origem.
    columns:
      - name: filial
        tests: [not_null]

  - name: stg_saldo_inicial_estoque
    description: >
      Saldo inicial de estoque por produto/local (SB9010). Grao
      recno_origem.
    columns:
      - name: recno_origem
        tests: [unique, not_null]

  - name: stg_saldo_fisico_compras
    description: >
      Saldo fisico de estoque relevante pra compras (SB2010, locais
      especificos), agregado. Grao filial+cod_produto.
    columns:
      - name: filial
        tests: [not_null]

  - name: stg_pedido_compra
    description: >
      Pedido de compra (SC7010) com status calculado (cascata de 9
      regras). Grao recno_origem.
    columns:
      - name: recno_origem
        tests: [unique, not_null]

  - name: stg_devolucao_compra
    description: >
      Devolucao em nota de entrada (SF1010+SD1010, tipo 'D'). Grao
      recno_origem. Consulta byte-identica em fCompras.m e
      fFinanceiro.m — resolvida uma vez so.
    columns:
      - name: recno_origem
        tests: [unique, not_null]

  - name: stg_historico_preco_compra
    description: >
      Historico de preco de compra por produto (SC7010), com preco
      anterior/medio/desvio via window functions. Grao recno_origem.
    columns:
      - name: recno_origem
        tests: [unique, not_null]

  - name: stg_cte_logistica
    description: >
      CT-e, lado logistico (GW3010). Grao recno_origem.
    columns:
      - name: recno_origem
        tests: [unique, not_null]

  - name: stg_rateio_frete
    description: >
      Rateio de frete por item de NF (GWM010). Grao recno_origem.
    columns:
      - name: recno_origem
        tests: [unique, not_null]

  - name: stg_doc_frete
    description: >
      Documento de frete com ocorrencia de transporte (GW4010 +
      GU3/GW3/GW1/GWL/GWD/AC9). Grao documento x anexo (recno_origem +
      recno_ac9) — um documento pode ter varios objetos anexados.
    columns:
      - name: recno_origem
        tests: [not_null]

  - name: stg_edi_cte
    description: >
      CT-e importado via EDI (GXG010+GU3010). Grao recno_origem.
      Corrige um bug do legado (UF origem usava o campo de UF
      destino) — ver nota no modelo.
    columns:
      - name: recno_origem
        tests: [unique, not_null]

  - name: stg_estoque_produto_acabado
    description: >
      Estoque de produto acabado por local (SB2010, codigo 'PA').
      Grao recno_origem.
    columns:
      - name: recno_origem
        tests: [unique, not_null]

  - name: stg_cte_financeiro
    description: >
      CT-e, lado financeiro — titulo a pagar de frete (SE2010+SA2010).
      Grao recno_origem.
    columns:
      - name: recno_origem
        tests: [unique, not_null]

  - name: stg_frete_entrada
    description: >
      Frete rateado em NF de entrada (GWM010, tipo doc '1'), agregado.
      Grao filial+nf+item+serie+fornecedor.
    columns:
      - name: filial
        tests: [not_null]

  - name: stg_motivo_rescisao
    description: >
      Motivo de rescisao com valor pago (SRG010+SRA010+RCC010+SRR010).
      Grao filial+matricula+cod_motivo+data_demissao.
    columns:
      - name: filial
        tests: [not_null]

  - name: stg_dupla_funcao
    description: >
      Funcionarios com evento de dupla funcao ativo (RG1010). Grao
      recno_origem.
    columns:
      - name: recno_origem
        tests: [unique, not_null]

  - name: stg_historico_salarial
    description: >
      Historico de alteracao de salario base (SR3010), historico
      completo (sem o corte de data do legado). Grao recno_origem.
    columns:
      - name: recno_origem
        tests: [unique, not_null]
