version: 2
models:
- name: stg_apontamento_producao
  description: 'Apontamento de producao (SH6010) — operacao executada numa OP, com horario e quantidade
    produzida. Grao recno_origem.

    '
  columns:
  - name: recno_origem
    tests:
    - unique
    - not_null
- name: stg_ordem_producao
  description: 'Ordem de producao (SC2010), cabecalho com quantidades e datas planejadas/realizadas. Grao
    recno_origem.

    '
  columns:
  - name: recno_origem
    tests:
    - unique
    - not_null
  - name: op
    tests:
    - not_null
- name: stg_lancamento_producao
  description: 'Lancamento de estoque ligado a OP — consumo de massa/insumo (SD3010, TM>500). Grao recno_origem.
    Sem o filtro de filial 01004 do legado — ver nota no modelo.

    '
  columns:
  - name: recno_origem
    tests:
    - unique
    - not_null
- name: stg_reprocesso
  description: 'Reprocesso de producao (SD3010, TM=200), com o produto-pai da OP original. Grao recno_origem.

    '
  columns:
  - name: recno_origem
    tests:
    - unique
    - not_null
- name: stg_produto_acabado
  description: 'Producao de produto acabado por OP (SD3010, TM=10), agregada. Grao filial+op+cod_produto.

    '
  columns:
  - name: filial
    tests:
    - not_null
  - name: op
    tests:
    - not_null
- name: stg_consumo_producao
  description: 'Consumo de materia-prima/insumo por OP (SD3010, CFOP contendo ''RE''), agregado. Grao
    filial+op+cod_produto+data.

    '
  columns:
  - name: filial
    tests:
    - not_null
  - name: op
    tests:
    - not_null
- name: stg_perdas_producao
  description: 'Perdas de producao por OP (SD3010, TM=507), agregada. Grao filial+op+cod_produto+data.

    '
  columns:
  - name: filial
    tests:
    - not_null
  - name: op
    tests:
    - not_null
- name: stg_saldo_inicial_estoque
  description: 'Saldo inicial de estoque por produto/local (SB9010). Grao recno_origem.

    '
  columns:
  - name: recno_origem
    tests:
    - unique
    - not_null
- name: stg_estoque_produto_acabado
  description: 'Estoque de produto acabado por local (SB2010, codigo ''PA''). Grao recno_origem.

    '
  columns:
  - name: recno_origem
    tests:
    - unique
    - not_null
