# =====================================================================
# Fontes do bronze — espelho de tabelas do Protheus
# ---------------------------------------------------------------------
# Cada tabela e extraida UMA vez e serve a todos os dominios. Nada aqui
# filtra, converte ou decide: regra de negocio vive na camada prata.
#
#   nome              identificador da fonte (usado no controle_cargas)
#   tabela            tabela no SQL Server do Protheus
#   destino           tabela no schema bronze
#   chave             chave do MERGE. R_E_C_N_O_ e unico por tabela no
#                     Protheus — resolve o incremental sem chave composta
#   coluna_watermark  coluna de data/timestamp pra carga incremental.
#                     Ausente = carga full (so quando nao ha nenhum campo
#                     confiavel pra watermark, ex.: DAK010)
#   tipo_watermark    'timestamp' pro _STAMP_ nativo do Protheus (datetime,
#                     atualizado pelo proprio ERP a cada insercao/alteracao
#                     em qualquer tabela — inclusive quando um cadastro e
#                     marcado como deletado). Ausente = data de negocio em
#                     texto YYYYMMDD (D2_EMISSAO e afins).
#   colunas           opcional. Padrao '*' — pouso fiel, e traz de graca
#                     os campos customizados (_X_) da Alles
# =====================================================================

fontes:
  # ---------- Comercial: notas de saida ----------
  - nome: SD2010
    tabela: SD2010
    destino: bronze.sd2010
    chave: R_E_C_N_O_
    coluna_watermark: D2_EMISSAO
    janela_movel_dias: 45

  - nome: SF2010
    tabela: SF2010
    destino: bronze.sf2010
    chave: R_E_C_N_O_
    coluna_watermark: F2_EMISSAO
